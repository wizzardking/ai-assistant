[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.1.0"
description = "Radial AI assistant overlay for Linux Mint Cinnamon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "openai>=1.0",
    "pynput>=1.7",
    "secretstorage>=3.3",
    "pydantic>=2.0",
]

[project.scripts]
ai-assistant = "ai_assistant.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_assistant*"]

